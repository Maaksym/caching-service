# Запуск образу з Dockerfile; тут описані порт і постійні дані контейнера.
services:
  api:
    build: .  # Збираємо образ із поточного каталогу.
    # Доступ із комп'ютера через http://127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    # SQLite та JSON зберігаються в томі, окремо від локальної папки data.
    volumes:
      - cache-data:/app/data
    init: true  # Допомагає передавати сигнали завершення процесу.

# Іменований том переживає звичайне видалення контейнера.
volumes:
  cache-data:
