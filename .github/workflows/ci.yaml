# GitHub Actions: після push/подій PR перевіряємо код, тести та збірку образу.
name: Checks

on:
  push:
  pull_request:

# Workflow читає репозиторій.
permissions:
  contents: read

jobs:
  # Однакові перевірки для двох підтримуваних версій Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    # Завантажити код -> Python -> залежності -> Ruff -> pytest із coverage.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --constraint requirements.lock '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=caching_service --cov-report=term-missing

  # Перевіряє Docker build; контейнер у цьому job не запускається.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t caching-service:test .
