# Опис встановлення пакета; цей файл не обробляє HTTP-запити.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Назва, версія, Python і бібліотеки для роботи сервера та CLI.
[project]
name = "caching-service"
version = "0.1.0"
description = "A FastAPI service with persistent string and payload caches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15,<3",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

# Додаткові інструменти перевірок: встановлення через .[dev].
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

# pip створює команду cache-cli, яка викликає main() у cli.py.
[project.scripts]
cache-cli = "caching_service.cli:main"

# Наш Python-пакет знаходиться в src.
[tool.setuptools.packages.find]
where = ["src"]

# pytest шукає тести в tests; -ra показує короткий підсумок.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Ruff перевіряє код і форматування для підтримуваного Python 3.10.
[tool.ruff]
target-version = "py310"
line-length = 100

# Групи правил: помилки, імпорти, підозрілі конструкції та спрощення.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
